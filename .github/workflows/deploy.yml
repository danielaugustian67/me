name: Deploy ke VPS

on:
  push:
    branches: [portfolio-site]
  workflow_dispatch:

concurrency: deploy-site

env:
  VPS_HOST: 43.134.103.221
  VPS_USER: deploy-daniel
  # Host key publik server, sudah dicocokkan dengan sidik jari di panduan VPS.
  VPS_KNOWN_HOSTS: |
    43.134.103.221 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBFmE35hENZAf0KbAFJwC011jlvUn8BLdFFJiMcQsMW7e0vTXpZbmcVn3U4eU7IHznnNYzK+jLU2fPQYVrxYsW+o=
    43.134.103.221 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAwToJyVtnxgMze84kojVr35uFDKR/bgdav9JyByQHwS
    43.134.103.221 ssh-rsa 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Siapkan kunci SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      # Tanpa -p/-g: folder di server memakai setgid grup caddy, dan deploy-daniel bukan anggotanya,
      # jadi chmod dari rsync akan menghapus setgid dan Caddy tidak bisa membaca file baru.
      - name: Kirim situs
        run: |
          rsync -rltz --delete-delay dist/ \
            "$VPS_USER@$VPS_HOST":/srv/deploy-daniel/portfolio/
